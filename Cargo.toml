[package]
name = "kastrup"
version = "0.1.134"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Unified messaging hub TUI, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/kastrup"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1", path = "../glow", package = "fe2o3-glow" }
highlight = { version = "0.1", path = "../highlight", package = "fe2o3-highlight" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["tls"] }
regex = "1"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
# Native Rust SMTP send (XOAUTH2 to Gmail). native-tls for the TLS
# transport, base64 for the SASL XOAUTH2 string encoding. ureq above
# already handles the OAuth-refresh HTTPS POST.
native-tls = "0.2"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
