[package]
name = "kastrup"
version = "0.1.135"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Unified messaging hub TUI, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/kastrup"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1", path = "../glow", package = "fe2o3-glow" }
highlight = { version = "0.1", path = "../highlight", package = "fe2o3-highlight" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["tls"] }
regex = "1"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
# Native Rust SMTP send (XOAUTH2 to Gmail). rustls (pure-Rust TLS,
# no OpenSSL dep — important for cross-compile aarch64 CI) +
# webpki-roots (Mozilla CA bundle). Versions match what ureq
# already pulls in transitively so we share crates rather than
# bloating the binary with two TLS backends. base64 for SASL
# XOAUTH2 encoding.
rustls = "0.23"
webpki-roots = "0.26"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
