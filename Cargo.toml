[package]
name = "kastrup"
version = "0.3.33"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Unified messaging hub TUI, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/kastrup"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1", path = "../glow", package = "fe2o3-glow" }
highlight = { version = "0.1", path = "../highlight", package = "fe2o3-highlight" }
# Email plumbing (MIME, HTML-to-text, cross-device read state), shared
# with the nomad phone app so the two cannot drift.
mail = { version = "0.3", path = "../mail", package = "fe2o3-mail" }
# RSS/Atom parsing, shared with the nomad phone app.
feed = { version = "0.1", path = "../feed", package = "fe2o3-feed" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["tls"] }
regex = "1"
libc = "0.2"
socket2 = { version = "0.5", features = ["all"] }
# Native Rust SMTP send (XOAUTH2 to Gmail). rustls (pure-Rust TLS,
# no OpenSSL dep — important for cross-compile aarch64 CI) +
# webpki-roots (Mozilla CA bundle). Versions match what ureq
# already pulls in transitively so we share crates rather than
# bloating the binary with two TLS backends. base64 for SASL
# XOAUTH2 encoding.
rustls = "0.23"
webpki-roots = "0.26"
base64 = "0.22"

# inotify watcher for maildir new/ dirs — wakes the poller within
# milliseconds of gmail-idle (or any other actor) dropping a file
# into the inbox, instead of waiting up to 10 s for the next poll
# tick. Zero idle cost: the watcher thread blocks on a single
# read() syscall on the inotify fd until the kernel fires an event.
# Linux-only API; macOS/BSD builds fall back to the poll cadence.
[target.'cfg(target_os = "linux")'.dependencies]
inotify = "0.11"

[profile.release]
opt-level = 3
lto = true
